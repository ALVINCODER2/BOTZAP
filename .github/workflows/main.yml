name: Bot WhatsApp 24h

on:
  # GATILHO 1: Roda automaticamente assim que você faz um 'git push'
  push:
    branches: ["main"]

  # GATILHO 2: Reinicia automaticamente a cada 5 horas e 30 min para não cair
  schedule:
    - cron: "30 */5 * * *"

  # GATILHO 3: Permite clicar no botão para rodar manualmente se precisar
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 330 # Mata o processo antes de 6h para evitar bloqueio do GitHub

    steps:
      - name: Baixar Código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"

      # Cache para tentar salvar a sessão do WhatsApp entre reinícios
      - name: Cache da Sessão WhatsApp
        uses: actions/cache@v3
        id: session-cache
        with:
          path: |
            .wwebjs_auth
            .wwebjs_cache
          key: session-${{ github.run_id }}
          restore-keys: |
            session-

      - name: Instalar Dependências do Projeto
        run: npm ci

      # Instala o Chrome e dependências necessárias para o Linux
      - name: Instalar Dependências do Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev wget unzip fontconfig locales gconf-service libasound2 libatk1.0-0 libc6 libcairo2 libcups2 libdbus-1-3 libexpat1 libfontconfig1 libgcc1 libgconf-2-4 libgdk-pixbuf2.0-0 libglib2.0-0 libgtk-3-0 libnspr4 libpango-1.0-0 libpangocairo-1.0-0 libstdc++6 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6 ca-certificates fonts-liberation libappindicator1 libnss3 lsb-release xdg-utils

      - name: Iniciar Bot
        run: node index.js
