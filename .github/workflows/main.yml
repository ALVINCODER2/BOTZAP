name: Bot WhatsApp 24h

on:
  push:
    branches: ["main"]
  # Roda a cada 6 horas (00:00, 06:00, 12:00, 18:00 UTC)
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-22.04
    timeout-minutes: 350 # 5h 50m

    steps:
      - name: Baixar Código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"

      - name: Cache da Sessão WhatsApp
        uses: actions/cache@v3
        id: session-cache
        with:
          path: |
            .wwebjs_auth
            .wwebjs_cache
          # CORREÇÃO: Usar chave única para forçar restore-keys a pegar a última sessão válida
          key: whatsapp-session-${{ github.run_id }}
          restore-keys: |
            whatsapp-session-

      - name: Instalar Dependências do Projeto
        run: npm ci

      - name: Instalar Chromium e Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            chromium-browser \
            xvfb \
            libgbm-dev \
            wget \
            unzip \
            fontconfig \
            locales \
            gconf-service \
            libasound2 \
            libatk1.0-0 \
            libc6 \
            libcairo2 \
            libcups2 \
            libdbus-1-3 \
            libexpat1 \
            libfontconfig1 \
            libgcc1 \
            libgconf-2-4 \
            libgdk-pixbuf2.0-0 \
            libglib2.0-0 \
            libgtk-3-0 \
            libnspr4 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libstdc++6 \
            libx11-6 \
            libx11-xcb1 \
            libxcb1 \
            libxcomposite1 \
            libxcursor1 \
            libxdamage1 \
            libxext6 \
            libxfixes3 \
            libxi6 \
            libxrandr2 \
            libxrender1 \
            libxss1 \
            libxtst6 \
            ca-certificates \
            fonts-liberation \
            libappindicator1 \
            libnss3 \
            lsb-release \
            xdg-utils

      - name: Iniciar Bot com Xvfb
        run: |
          # Iniciar display virtual
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
          sleep 3
          
          # Configurar caminho do Chromium
          export PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser
          
          # Rodar o bot
          node index.js
        
      - name: Salvar Sessão (se houver mudanças)
        if: always()
        uses: actions/cache/save@v3
        with:
          path: |
            .wwebjs_auth
            .wwebjs_cache
          key: whatsapp-session-${{ github.run_id }}
